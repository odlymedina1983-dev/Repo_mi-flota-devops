apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: nginx-profesional
  namespace: dev
spec:
  interval: 5m
  chart:
    spec:
      chart: nginx
      version: "15.14.2"
      sourceRef:
        kind: HelmRepository
        name: bitnami-repo
        namespace: flux-system
  values:
    replicaCount: 1
    service:
      type: ClusterIP
    persistence:
      enabled: false
