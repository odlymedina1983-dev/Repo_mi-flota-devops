apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-redis
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-redis
  template:
    metadata:
      labels:
        app: chat-redis
    spec:
      containers:
      - name: redis
        image: redis:7.0-alpine
        ports:
        - containerPort: 6379
          name: redis-port
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "150m"
---
apiVersion: v1
kind: Service
metadata:
  name: chat-redis-svc
  namespace: dev
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: chat-redis