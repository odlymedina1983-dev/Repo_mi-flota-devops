apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-backend
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-backend
  template:
    metadata:
      labels:
        app: chat-backend
    spec:
      containers:
      - name: chat-app
        image: stefanprodan/podinfo:6.5.4
        command: ["./podinfo", "--backend-url=http://podinfo-app.dev.svc.cluster.local:9898/chitchat"]
        ports:
        - containerPort: 9898
          name: http
        env:
        - name: PODINFO_UI_COLOR
          value: "#202020"
---
apiVersion: v1
kind: Service
metadata:
  name: chat-backend-svc
  namespace: dev
spec:
  type: ClusterIP
  ports:
  - port: 9898
    targetPort: 9898
    name: http
  selector:
    app: chat-backend
