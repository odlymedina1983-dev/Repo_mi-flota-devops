apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-despliegue
  namespace: dev
  labels:
    app: mi-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mi-web
  template:
    metadata:
      labels:
        app: mi-web
    spec:
      containers:
      - name: nginx
        image: nginx:1.25.3
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
