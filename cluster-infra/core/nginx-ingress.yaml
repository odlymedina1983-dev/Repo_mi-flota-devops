apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-entrada
  namespace: dev
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx 
  rules:
  - host: mi-flota.local
    http:
      paths:
      
      # 🚀 1. EL FRONTEND DE PODINFO (Apuntando al servicio activo de tu app unificada)
      - path: /app/?(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: chat-app-svc  # 👈 CAMBIO AQUÍ: Ahora usa el servicio que sí está vivo
            port:
              number: 3000      # 👈 El puerto donde tu app unificada escucha

      # 💬 2. EL BACKEND DEL CHAT
      - path: /chat/?(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: chat-app-svc
            port:
              number: 3000

      # 🌐 3. LANDING TRADICIONAL
      - path: /()(.*)
        pathType: Prefix
        backend:
          service:
            name: nginx-servicio
            port:
              number: 80